# HomeCore OS — Mosquitto MQTT broker
# Authentication is mandatory; per-user topic permissions live in "acl",
# both managed by: homecore mqtt add|remove   (scripts/mqtt-user.sh)

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain MQTT on the LAN. The firewall only admits LAN and Tailscale clients.
# For TLS see docs/SECURITY.md ("MQTT over TLS").
listener 1883

# Abuse limits
max_connections 64
max_keepalive 300
max_packet_size 262144
max_inflight_messages 20
max_queued_messages 200

# Persistence with few writes (microSD friendly)
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
